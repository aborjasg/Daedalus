services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-daedalus}
      MYSQL_USER: ${MYSQL_USER:-daedalus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-daedalus}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
