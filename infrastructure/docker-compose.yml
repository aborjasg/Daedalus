services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-daedalus}
      POSTGRES_USER: ${DB_USER:-daedalus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-daedalus}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
